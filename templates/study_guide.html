<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        {{ common_css }}
    </style>
</head>
<body>

    <div class="header-badge">MÓDULO {{ mod_num }} | {{ role_name }}</div>
    <div class="doc-title">{{ main_title }}</div>
    <div class="doc-subtitle">{{ sub_title }}</div>

    <div class="meta-grid">
        <div class="meta-col" style="width: 32%;">
            <div class="meta-label">Estudiante Responsable</div>
            <div class="meta-value">{{ student_name }}</div>
        </div>
        <div class="meta-col" style="width: 25%;">
            <div class="meta-label">Tiempo Asignado</div>
            <div class="meta-value">{{ time_range }}</div>
        </div>
        <div class="meta-col" style="width: 43%;">
            <div class="meta-label">Modalidad de Evaluación</div>
            <div class="meta-value">Exposición en Tablero (Sin Diapositivas)</div>
        </div>
    </div>

    {{ content_body }}

</body>
</html>
